<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts are loaded here rather than @import-ed in SCSS: an @import inside a
         stylesheet isn't discovered until that stylesheet has downloaded, which
         delays the font request. A <link> in the head starts it immediately.
         preconnect opens the connection to Google's font hosts ahead of time.
         display=swap renders text in a fallback face until the webfont arrives,
         instead of leaving it invisible. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Work+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <title>Gabi — Claude Assistant Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
